name: Collect

# 10분마다 4개 본부의 온배수 현황을 수집해 data 브랜치에 게시한다.
# - 화면(GitHub Pages)과 측정 데이터를 분리했다. 화면은 data 브랜치의 latest.json·history.json 을
#   raw.githubusercontent.com 에서 직접 읽는다. Pages 배포는 화면 코드가 바뀔 때만 한다(deploy-site.yml).
#   (같은 커밋으로 10분마다 Pages 를 다시 배포하면 "성공"으로 끝나고도 사이트가 갱신되지 않는 일이 반복됐다.)
# - data 브랜치는 매번 커밋 1개로 덮어쓴다(force push). 누적 이력은 파일(data/*.csv)로 남기므로 사라지지 않는다.
#   덮어쓰기 전에 CSV 행 수가 줄지 않았는지 검사하고, 어긋나면 게시하지 않는다.
# - schedule 은 지연·누락이 잦아 cron-job.org 가 workflow_dispatch API 를 호출하는 것이 주 실행 경로다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 수집이 겹쳐 data 브랜치 게시가 충돌하지 않도록 직렬 실행한다.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  KEEP_DAYS: "120"   # 이보다 오래된 일별 CSV 는 정리한다

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      # 이전 data 브랜치의 파일만 내려받는다(이력 없이 파일 트리만).
      - name: Fetch previous data
        run: |
          mkdir data-out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data-out
          fi
          python3 scripts/check_data_dir.py snapshot --data-dir data-out --out prev-counts.json

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python3 scripts/collect.py --out data-out

      - name: Build history
        run: python3 scripts/history.py --data-dir data-out --prune-days "$KEEP_DAYS"

      # 덮어쓰기 전 안전 검사: latest·history 가 올바른지, 보존 기간 안의 CSV 가 줄지 않았는지.
      - name: Verify before publish
        run: python3 scripts/check_data_dir.py verify --data-dir data-out --prev prev-counts.json --keep-days "$KEEP_DAYS"

      - name: Publish data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data-out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data && exit 0
            sleep 3
          done
          echo "::error::data 브랜치 게시 실패"
          exit 1

      # 일부 본부 수집이 실패해도 성공분은 위에서 게시한다. 실패는 여기서 워크플로 실패로 표시해 알림을 받는다.
      - name: Fail if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
